<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renacer Drinks & Coffee - Menú Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      background-color: #0f0f0f;
    }

    /* Video de fondo */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -2;
      object-fit: cover;
    }

    /* Capa oscura sobre el video */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: -1;
    }

    /* Encabezado */
    header {
      text-align: center;
      padding: 30px 15px 15px 15px;
      color: #fff;
    }

    header h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: #f8c146;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    header p {
      font-size: 1.1rem;
      margin-top: 5px;
      color: #e0e0e0;
    }

    /* Banner Tasa BCV */
    .bcv-banner {
      background: rgba(248, 193, 70, 0.9);
      color: #111;
      text-align: center;
      padding: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      margin: 10px auto 20px auto;
      max-width: 600px;
      border-radius: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px 40px 15px;
    }

    /* Categorías */
    .categoria-titulo {
      color: #f8c146;
      font-size: 1.6rem;
      border-bottom: 2px solid #f8c146;
      padding-bottom: 5px;
      margin: 30px 0 15px 0;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    /* Productos */
    .producto-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
    }

    .producto-info {
      flex: 1;
      padding-right: 15px;
    }

    .producto-nombre {
      font-size: 1.15rem;
      font-weight: bold;
      color: #222;
    }

    .producto-desc {
      font-size: 0.88rem;
      color: #555;
      margin-top: 4px;
    }

    .producto-precios {
      text-align: right;
      min-width: 100px;
    }

    .precio-usd {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2e7d32;
    }

    .precio-ves {
      font-size: 0.85rem;
      color: #666;
      margin-top: 2px;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Video de Fondo (Con atributos requeridos para autoplay) -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="video.MP4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <header>
    <h1>Renacer</h1>
    <p>Drinks & Coffee</p>
  </header>

  <div id="bcv-banner" class="bcv-banner">
    Cargando tasa BCV del día...
  </div>

  <div class="container" id="menu-container">
    <!-- El contenido del menú se carga aquí dinámicamente desde menu.json -->
  </div>

  <footer>
    <p>&copy; Renacer Drinks & Coffee. Todos los derechos reservados.</p>
  </footer>

  <script>
    let tasaBCV = 0;

    // Obtener la tasa del BCV
    async function obtenerTasaBCV() {
      try {
        const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
        const data = await res.json();
        tasaBCV = data.promedio;
        document.getElementById('bcv-banner').innerText = `Tasa Oficial BCV Hoy: Bs. ${tasaBCV.toFixed(2)}`;
      } catch (e) {
        console.error("Error obteniendo tasa BCV:", e);
        document.getElementById('bcv-banner').innerText = "Tasa Oficial BCV";
      }
    }

    // Cargar menú desde menu.json
    async function cargarMenu() {
      await obtenerTasaBCV();
      try {
        const res = await fetch('menu.json');
        const data = await res.json();
        const container = document.getElementById('menu-container');
        container.innerHTML = '';

        data.categorias.forEach(cat => {
          const catTitle = document.createElement('h2');
          catTitle.className = 'categoria-titulo';
          catTitle.innerText = cat.nombre;
          container.appendChild(catTitle);

          cat.productos.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'producto-card';

            const precioUSD = parseFloat(prod.precio);
            const precioVES = tasaBCV > 0 ? (precioUSD * tasaBCV).toFixed(2) : null;

            card.innerHTML = `
              <div class="producto-info">
                <div class="producto-nombre">${prod.nombre}</div>
                ${prod.descripcion ? `<div class="producto-desc">${prod.descripcion}</div>` : ''}
              </div>
              <div class="producto-precios">
                <div class="precio-usd">$${precioUSD.toFixed(2)}</div>
                ${precioVES ? `<div class="precio-ves">Bs. ${precioVES}</div>` : ''}
              </div>
            `;
            container.appendChild(card);
          });
        });
      } catch (e) {
        console.error("Error cargando el menú:", e);
      }
    }

    // Forzar reproducción de video si el navegador lo detiene
    document.addEventListener('DOMContentLoaded', function() {
      cargarMenu();
      var video = document.getElementById('bg-video');
      if (video) {
        video.play().catch(function(error) {
          console.log("Autoplay controlado por navegador:", error);
        });
      }
    });
  </script>
</body>
</html>
